# Prometheus configuration for SmartVault
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "smartvault"
    environment: "development"

scrape_configs:
  - job_name: "smartvault-api"
    static_configs:
      - targets: ["api:8000"]
        labels:
          app: "smartvault"
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]