name: CI

on:
  push:
    branches:
      - dev
      - feature/**
      - refactor/**
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: smartvault
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d smartvault"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # CI runs on host network; use localhost + published ports
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smartvault
      REDIS_URL: redis://localhost:6379/0

      # required by Settings/tests
      SECRET_KEY: super-secret-key-that-you-should-change-me
      APP_ENV: development
      DEBUG: "true"
      ADMIN_API_TOKEN: ci-admin-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest
